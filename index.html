<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario Institucional - ANT</title>

<style>
/* TU CSS ORIGINAL (NO TOCADO) */
body {
    font-family: 'Montserrat', 'Segoe UI', sans-serif;
    background: url('ANT.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    min-height: 100vh;
}

.card {
    background: rgba(10, 30, 20, 0.7); 
    backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 20px;
    width: 380px;
    color: #fff;
}

h2 { text-align: center; color: #f1c40f; }

input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}

#calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
}

.day { cursor:pointer; text-align:center; }
.weekend { color: red; }
.holiday { color: yellow; }
.selected { background: yellow; color:black; }
</style>
</head>

<body>

<div class="card">
    <h2>ANT CALENDARIO</h2>

    <select id="tipo">
        <option value="habiles">Días Hábiles</option>
        <option value="calendario">Días Calendario</option>
    </select>

    <button onclick="cambiarMes(-1)">‹</button>

    <select id="monthSelector" onchange="cambiarMesRapido()">
        <option value="0">Enero</option>
        <option value="1">Febrero</option>
        <option value="2">Marzo</option>
        <option value="3">Abril</option>
        <option value="4">Mayo</option>
        <option value="5">Junio</option>
        <option value="6">Julio</option>
        <option value="7">Agosto</option>
        <option value="8">Septiembre</option>
        <option value="9">Octubre</option>
        <option value="10">Noviembre</option>
        <option value="11">Diciembre</option>
    </select>

    <select id="year" onchange="cambiarAño()"></select>

    <button onclick="cambiarMes(1)">›</button>

    <h3 id="tituloMes"></h3>

    <div id="calendar"></div>

    <p id="fechaSeleccionada"></p>

    <input type="number" id="dias" placeholder="Ej. 15">
    <button onclick="calcular()">CALCULAR</button>

    <div id="resultado"></div>
</div>

<script>
const API_URL = "https://calendario-api-wpy4.onrender.com";

let festivos = [];

// 🔥 FECHA REAL
const hoy = new Date();
let mesActual = hoy.getMonth();
let anioActual = hoy.getFullYear();

let fechaSeleccionada = `${anioActual}-${String(mesActual+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;


// 🔥 CARGAR FESTIVOS
async function cargarFestivos() {
    try {
        const res = await fetch(`${API_URL}/festivos`);
        const data = await res.json();

        festivos = data.map(f => f.fecha.split('T')[0]);

    } catch (e) {
        console.log("Error cargando festivos");
    }

    generarCalendario();
}


// 🔥 AÑOS
function cargarAnios() {
    const select = document.getElementById("year");
    select.innerHTML = "";

    for (let i = 2020; i <= 2035; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.innerText = i;
        select.appendChild(opt);
    }

    select.value = anioActual;
}


// 🔥 CALENDARIO
function generarCalendario() {
    const calendar = document.getElementById("calendar");
    const titulo = document.getElementById("tituloMes");

    calendar.innerHTML = "";

    const nombresMes = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    titulo.innerText = `${nombresMes[mesActual]} ${anioActual}`;

    // ✅ FIX: sincronizar selects SIEMPRE
    document.getElementById("monthSelector").value = mesActual;
    document.getElementById("year").value = anioActual;

    document.getElementById("fechaSeleccionada").innerText = "Fecha base: " + fechaSeleccionada;

    let primerDia = new Date(anioActual, mesActual, 1).getDay();
    let offset = primerDia === 0 ? 6 : primerDia - 1;

    for (let i = 0; i < offset; i++) {
        calendar.innerHTML += "<div></div>";
    }

    const diasMes = new Date(anioActual, mesActual + 1, 0).getDate();

    for (let i = 1; i <= diasMes; i++) {
        const fecha = new Date(anioActual, mesActual, i);
        const fechaStr = `${anioActual}-${String(mesActual+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const diaSemana = (fecha.getDay() + 6) % 7;

        let clases = "day";

        if (diaSemana >= 5) clases += " weekend";
        if (festivos.includes(fechaStr)) clases += " holiday";
        if (fechaSeleccionada === fechaStr) clases += " selected";

        calendar.innerHTML += `<div class="${clases}" onclick="seleccionar('${fechaStr}', ${diaSemana})">${i}</div>`;
    }
}


// 🔥 SELECCIONAR
function seleccionar(fecha, diaSemana) {
    const tipo = document.getElementById("tipo").value;

    if (tipo === "habiles" && diaSemana >= 5) return;

    fechaSeleccionada = fecha;
    generarCalendario();
}


// 🔄 CAMBIOS
function cambiarMes(d) {
    mesActual += d;

    if (mesActual < 0) { mesActual = 11; anioActual--; }
    if (mesActual > 11) { mesActual = 0; anioActual++; }

    generarCalendario();
}

function cambiarMesRapido() {
    mesActual = parseInt(document.getElementById("monthSelector").value);
    generarCalendario();
}

function cambiarAño() {
    anioActual = parseInt(document.getElementById("year").value);
    generarCalendario();
}


// 🔥 CALCULAR (SIN ERROR)
async function calcular() {
    const dias = document.getElementById("dias").value;
    const tipo = document.getElementById("tipo").value;
    const resultado = document.getElementById("resultado");

    if (!dias) {
        resultado.innerText = "Ingrese días";
        return;
    }

    try {
        const res = await fetch(`${API_URL}/calcular?fecha=${fechaSeleccionada}&dias=${dias}&tipo=${tipo}`);
        const data = await res.json();

        console.log("RESPUESTA API:", data);

        if (!data || !data.resultado) {
            resultado.innerText = "Error en respuesta del servidor";
            return;
        }

        const f = new Date(data.resultado);

        if (isNaN(f.getTime())) {
            resultado.innerText = "Fecha inválida";
            return;
        }

        resultado.innerText =
            `Vencimiento: ${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')}/${f.getFullYear()}`;

    } catch (e) {
        resultado.innerText = "Error de conexión";
        console.log(e);
    }
}


// 🚀 INIT (IMPORTANTE ORDEN)
cargarAnios();
generarCalendario(); // 👈 primero pinta con fecha actual
cargarFestivos();    // 👈 luego mejora con festivos


// 🔥 ANTI-SLEEP
setInterval(() => {
    fetch(`${API_URL}/festivos`).catch(()=>{});
}, 300000);

</script>
