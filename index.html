<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario Institucional - ANT</title>

<style>
    body {
        font-family: 'Montserrat', 'Segoe UI', sans-serif;
        background: url('ANT.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        min-height: 100vh;
    }

    .card {
        background: rgba(10, 30, 20, 0.7); 
        backdrop-filter: blur(15px);
        padding: 30px;
        border-radius: 20px;
        width: 380px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
    }

    h2 { 
        text-align: center; 
        color: #f1c40f; 
    }

    label {
        font-size: 10px;
        font-weight: 700;
        color: #bdc3c7;
        margin-top: 15px;
        display: block;
    }

    input, select, button {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.2);
        font-size: 14px;
        background: rgba(0, 0, 0, 0.3);
        color: white;
    }

    button {
        background: #1b5e20;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
    }

    #resultado {
        margin-top: 15px;
        text-align: center;
        padding: 12px;
        border-radius: 10px;
    }

    .ok { background: rgba(40, 167, 69, 0.3); }
    .error { background: rgba(220, 53, 69, 0.3); }

    .controls { display: flex; gap: 8px; }
    .nav-btn { width: 40px; }

    #calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        margin-top: 10px;
    }

    .day {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        cursor: pointer;
    }

    .weekend { color: #ff7675; }
    .holiday { color: #f1c40f; font-weight: bold; }
    .selected { background: #f1c40f; color: black; }
</style>
</head>

<body>

<div class="card">
    <h2>ANT CALENDARIO</h2>

    <label>Tipo</label>
    <select id="tipo" onchange="generarCalendario()">
        <option value="habiles">Días Hábiles</option>
        <option value="calendario">Días Calendario</option>
    </select>

    <div class="controls">
        <button onclick="cambiarMes(-1)">‹</button>
        <select id="monthSelector" onchange="cambiarMesRapido()">
            <option value="0">Enero</option>
            <option value="1">Febrero</option>
            <option value="2">Marzo</option>
            <option value="3">Abril</option>
            <option value="4">Mayo</option>
            <option value="5">Junio</option>
            <option value="6">Julio</option>
            <option value="7">Agosto</option>
            <option value="8">Septiembre</option>
            <option value="9">Octubre</option>
            <option value="10">Noviembre</option>
            <option value="11">Diciembre</option>
        </select>
        <select id="year" onchange="cambiarAño()"></select>
        <button onclick="cambiarMes(1)">›</button>
    </div>

    <div id="calendar"></div>
    <p id="fechaSeleccionada"></p>

    <label>Días</label>
    <input type="number" id="dias">

    <button onclick="calcular()">CALCULAR</button>
    <div id="resultado"></div>
</div>

<script>
// 🔥 TU API REAL
const API_URL = "https://calendario-api-wpy4.onrender.com";

let festivos = [];
let fechaSeleccionada = null;
let mesActual = new Date().getMonth();
let anioActual = new Date().getFullYear();

async function cargarFestivos() {
    try {
        const res = await fetch(`${API_URL}/festivos`);
        const data = await res.json();
        festivos = data.map(f => f.fecha.split('T')[0]);
    } catch (e) {
        console.log("Error cargando festivos");
    }
    generarCalendario();
}

function cargarAnios() {
    const select = document.getElementById("year");
    for (let i = 2020; i <= 2035; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.innerText = i;
        select.appendChild(opt);
    }
    select.value = anioActual;
}

function cambiarAño() {
    anioActual = parseInt(document.getElementById("year").value);
    generarCalendario();
}

function cambiarMesRapido() {
    mesActual = parseInt(document.getElementById("monthSelector").value);
    generarCalendario();
}

function generarCalendario() {
    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    let primerDia = new Date(anioActual, mesActual, 1).getDay();
    let offset = primerDia === 0 ? 6 : primerDia - 1;

    for (let s = 0; s < offset; s++) {
        const div = document.createElement("div");
        calendar.appendChild(div);
    }

    const diasMes = new Date(anioActual, mesActual + 1, 0).getDate();

    for (let i = 1; i <= diasMes; i++) {
        const fecha = new Date(anioActual, mesActual, i);
        const fechaStr = `${anioActual}-${String(mesActual+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const diaSemana = (fecha.getDay() + 6) % 7;

        const div = document.createElement("div");
        div.className = "day";
        div.innerText = i;

        if (diaSemana >= 5) div.classList.add("weekend");
        if (festivos.includes(fechaStr)) div.classList.add("holiday");

        div.onclick = () => {
            fechaSeleccionada = fechaStr;
            document.getElementById("fechaSeleccionada").innerText = fechaStr;
            generarCalendario();
        };

        if (fechaSeleccionada === fechaStr) {
            div.classList.add("selected");
        }

        calendar.appendChild(div);
    }
}

function cambiarMes(d) {
    mesActual += d;
    if (mesActual < 0) { mesActual = 11; anioActual--; }
    else if (mesActual > 11) { mesActual = 0; anioActual++; }
    document.getElementById("year").value = anioActual;
    generarCalendario();
}

async function calcular() {
    const dias = document.getElementById("dias").value;
    const tipo = document.getElementById("tipo").value;

    if (!fechaSeleccionada || !dias) {
        document.getElementById("resultado").innerText = "Completa datos";
        return;
    }

    const res = await fetch(`${API_URL}/calcular?fecha=${fechaSeleccionada}&dias=${dias}&tipo=${tipo}`);
    const data = await res.json();

    document.getElementById("resultado").innerText = "Resultado: " + data.resultado;
}

cargarAnios();
cargarFestivos();
</script>

</body>
</html>
