<script>
// 🔥 TU API REAL
const API_URL = "https://calendario-api-wpy4.onrender.com";

let festivos = [];
let fechaSeleccionada = null;
let mesActual = new Date().getMonth();
let anioActual = new Date().getFullYear();

async function cargarFestivos() {
    try {
        const res = await fetch(`${API_URL}/festivos`);
        const data = await res.json();
        festivos = data.map(f => f.fecha.split('T')[0]);
    } catch (e) { console.log("Festivos no disponibles"); }
    generarCalendario();
}

function cargarAnios() {
    const select = document.getElementById("year");
    for (let i = 2020; i <= 2035; i++) {
        const opt = document.createElement("option");
        opt.value = i; opt.innerText = i;
        select.appendChild(opt);
    }
    select.value = anioActual;
}

function cambiarAño() { anioActual = parseInt(document.getElementById("year").value); generarCalendario(); }
function cambiarMesRapido() { mesActual = parseInt(document.getElementById("monthSelector").value); generarCalendario(); }

function generarCalendario() {
    const calendar = document.getElementById("calendar");
    const titulo = document.getElementById("tituloMes");
    const monthSelector = document.getElementById("monthSelector");
    calendar.innerHTML = "";

    const nombresMes = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    titulo.innerText = `${nombresMes[mesActual]} ${anioActual}`;
    monthSelector.value = mesActual;

    let primerDia = new Date(anioActual, mesActual, 1).getDay();
    let offset = primerDia === 0 ? 6 : primerDia - 1;

    for (let s = 0; s < offset; s++) {
        const div = document.createElement("div");
        div.className = "day empty";
        calendar.appendChild(div);
    }

    const diasMes = new Date(anioActual, mesActual + 1, 0).getDate();

    for (let i = 1; i <= diasMes; i++) {
        const fecha = new Date(anioActual, mesActual, i);
        const fechaStr = `${anioActual}-${String(mesActual+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const diaSemana = (fecha.getDay() + 6) % 7;

        const div = document.createElement("div");
        div.className = "day";
        div.innerText = i;

        if (diaSemana >= 5) div.classList.add("weekend");
        if (festivos.includes(fechaStr)) div.classList.add("holiday");
        if (fechaSeleccionada === fechaStr) div.classList.add("selected");

        div.onclick = () => {
            const tipo = document.getElementById("tipo").value;
            if (tipo === "habiles" && (diaSemana >= 5 || festivos.includes(fechaStr))) return;
            fechaSeleccionada = fechaStr;
            document.getElementById("fechaSeleccionada").innerText = "Fecha base: " + fechaStr;
            generarCalendario();
        };
        calendar.appendChild(div);
    }
}

function cambiarMes(d) {
    mesActual += d;
    if (mesActual < 0) { mesActual = 11; anioActual--; }
    else if (mesActual > 11) { mesActual = 0; anioActual++; }
    document.getElementById("year").value = anioActual;
    generarCalendario();
}

async function calcular() {
    const dias = document.getElementById("dias").value;
    const tipo = document.getElementById("tipo").value;
    const resultado = document.getElementById("resultado");

    if (!fechaSeleccionada || !dias) {
        resultado.innerHTML = "Complete los datos";
        resultado.className = "error";
        return;
    }

    try {
        const res = await fetch(`${API_URL}/calcular?fecha=${fechaSeleccionada}&dias=${dias}&tipo=${tipo}`);
        const data = await res.json();
        const f = new Date(data.resultado);

        const out = `${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')}/${f.getFullYear()}`;
        resultado.innerHTML = "Vencimiento: " + out;
        resultado.className = "ok";
    } catch (e) {
        resultado.innerHTML = "Error de servidor";
        resultado.className = "error";
    }
}

cargarAnios();
cargarFestivos();
</script>
